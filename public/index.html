<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NodeLab - Login & Signup</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
        }

        h2 {
            margin-top: 25px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            background: #333;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #555;
        }

        .message {
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>NodeLab</h1>

        <!-- SIGN UP -->

        <h2>Sign Up</h2>

        <form id="signupForm">

            <input
                type="text"
                id="signupName"
                placeholder="Name"
                required
            >

            <input
                type="email"
                id="signupEmail"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="signupPassword"
                placeholder="Password"
                required
            >

            <button type="submit">
                Sign Up
            </button>

        </form>

        <p id="signupMessage" class="message"></p>


        <!-- LOGIN -->

        <h2>Log In</h2>

        <form id="loginForm">

            <input
                type="email"
                id="loginEmail"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                required
            >

            <button type="submit">
                Log In
            </button>

        </form>

        <p id="loginMessage" class="message"></p>

    </div>


    <script>

        // ==========================================
        // SIGN UP
        // ==========================================

        document
            .getElementById('signupForm')
            .addEventListener('submit', async function(event) {

                event.preventDefault();

                const name =
                    document.getElementById('signupName').value;

                const email =
                    document.getElementById('signupEmail').value;

                const password =
                    document.getElementById('signupPassword').value;

                const response = await fetch('/signup', {
                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify({
                        name,
                        email,
                        password
                    })
                });

                const data = await response.json();

                document.getElementById('signupMessage')
                    .textContent = data.message;

                if (data.success) {
                    document.getElementById('signupForm').reset();
                }

            });


        // ==========================================
        // LOGIN
        // ==========================================

        document
            .getElementById('loginForm')
            .addEventListener('submit', async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById('loginEmail').value;

                const password =
                    document.getElementById('loginPassword').value;

                const response = await fetch('/login', {
                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify({
                        email,
                        password
                    })
                });

                const data = await response.json();

                document.getElementById('loginMessage')
                    .textContent = data.message;

                // Successful login
                if (data.success) {

                    localStorage.setItem(
                        'userName',
                        data.name
                    );

                    localStorage.setItem(
                        'loggedIn',
                        'true'
                    );

                    window.location.href =
                        '/dashboard.html';
                }

            });

    </script>

</body>
</html>
